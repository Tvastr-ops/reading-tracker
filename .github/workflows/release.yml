name: Build & Release Client

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Android Target Architecture'
        required: true
        default: 'android-arm64'
        type: choice
        options:
          - 'android-arm64'
          - 'all'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/client
          flutter pub get

      - name: Build ARM64 Release APK
        if: ${{ inputs.target_arch == 'android-arm64' || startsWith(github.ref, 'refs/tags/v') || github.event_name != 'workflow_dispatch' }}
        run: |
          cd apps/client
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "main" ] || [ "$VERSION_NAME" = "dev" ]; then
            VERSION_NAME="1.1.0"
          fi
          flutter build apk --target-platform android-arm64 --release --build-name="$VERSION_NAME" --android-skip-build-dependency-validation
          mkdir -p ../../release-assets
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../../release-assets/reading-tracker-arm64.apk
          else
            cp build/app/outputs/flutter-apk/app-release.apk ../../release-assets/reading-tracker-arm64.apk
          fi

      - name: Build Universal Release APK (Optional)
        if: ${{ inputs.target_arch == 'all' }}
        run: |
          cd apps/client
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "main" ] || [ "$VERSION_NAME" = "dev" ]; then
            VERSION_NAME="1.1.0"
          fi
          flutter build apk --split-per-abi --release --build-name="$VERSION_NAME" --android-skip-build-dependency-validation
          mkdir -p ../../release-assets
          cp build/app/outputs/flutter-apk/*.apk ../../release-assets/ 2>/dev/null || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release-assets/*.apk
          retention-days: 14

  build-linux:
    name: Build Linux Desktop (DEB & Tarball)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/client
          flutter pub get

      - name: Build Linux Release Bundle
        run: |
          cd apps/client
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "main" ] || [ "$VERSION_NAME" = "dev" ]; then
            VERSION_NAME="1.1.0"
          fi
          flutter build linux --release --build-name="$VERSION_NAME"

      - name: Package Portable Tarball & Debian (.deb)
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-packages
          path: release-assets/*
          retention-days: 14

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-android, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: List Release Files
        run: ls -lh downloaded-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: downloaded-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
