name: Build & Release Client

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Android Target Architecture'
        required: true
        default: 'android-arm64'
        type: choice
        options:
          - 'android-arm64'
          - 'all'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/client
          flutter pub get

      - name: Build ARM64 Release APK
        if: ${{ inputs.target_arch == 'android-arm64' || startsWith(github.ref, 'refs/tags/v') || github.event_name != 'workflow_dispatch' }}
        run: |
          cd apps/client
          flutter build apk --target-platform android-arm64 --release --android-skip-build-dependency-validation
          mkdir -p ../../release-assets
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../../release-assets/reading-tracker-arm64.apk
          else
            cp build/app/outputs/flutter-apk/app-release.apk ../../release-assets/reading-tracker-arm64.apk
          fi

      - name: Build Universal Release APK (Optional)
        if: ${{ inputs.target_arch == 'all' }}
        run: |
          cd apps/client
          flutter build apk --split-per-abi --release --android-skip-build-dependency-validation
          mkdir -p ../../release-assets
          cp build/app/outputs/flutter-apk/*.apk ../../release-assets/ 2>/dev/null || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release-assets/*.apk
          retention-days: 14

  build-linux:
    name: Build Linux Desktop (DEB & Tarball)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/client
          flutter pub get

      - name: Build Linux Release Bundle
        run: |
          cd apps/client
          flutter build linux --release

      - name: Package Portable Tarball & Debian (.deb)
        run: |
          mkdir -p release-assets
          
          # 1. Portable .tar.gz
          tar -czf release-assets/reading-tracker-linux-x64.tar.gz -C apps/client/build/linux/x64/release/bundle .

          # 2. Native .deb Package
          VERSION_CLEAN="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_CLEAN" ] || [ "$VERSION_CLEAN" = "main" ] || [ "$VERSION_CLEAN" = "dev" ]; then
            VERSION_CLEAN="1.1.0"
          fi

          mkdir -p deb-pkg/DEBIAN
          mkdir -p deb-pkg/usr/lib/paperback-reader
          mkdir -p deb-pkg/usr/bin
          mkdir -p deb-pkg/usr/share/applications
          mkdir -p deb-pkg/usr/share/icons/hicolor/512x512/apps

          # Copy binaries and bundle assets
          cp -r apps/client/build/linux/x64/release/bundle/* deb-pkg/usr/lib/paperback-reader/
          chmod +x deb-pkg/usr/lib/paperback-reader/paperback_reader

          # Wrapper script
          cat << 'EOF' > deb-pkg/usr/bin/paperback-reader
#!/bin/sh
exec /usr/lib/paperback-reader/paperback_reader "$@"
EOF
          chmod 755 deb-pkg/usr/bin/paperback-reader

          # Desktop entry
          cat << 'EOF' > deb-pkg/usr/share/applications/paperback-reader.desktop
[Desktop Entry]
Name=Paperback Reader
Comment=A tactile, offline-first reading ledger for novels, light novels, and web serials
Exec=paperback-reader %u
Icon=paperback-reader
Terminal=false
Type=Application
Categories=Utility;Office;Literature;
StartupWMClass=paperback_reader
EOF
          chmod 644 deb-pkg/usr/share/applications/paperback-reader.desktop

          # App icon
          cp apps/client/assets/icon.png deb-pkg/usr/share/icons/hicolor/512x512/apps/paperback-reader.png

          # Debian Control metadata
          cat << EOF > deb-pkg/DEBIAN/control
Package: paperback-reader
Version: $VERSION_CLEAN
Section: utils
Priority: optional
Architecture: amd64
Maintainer: Paperback Reader <noreply@github.com>
Depends: libgtk-3-0, libsqlite3-0
Description: Paperback Reader
 A tactile, offline-first reading ledger for novels, light novels, and web serials.
EOF

          dpkg-deb --build --root-owner-group deb-pkg release-assets/reading-tracker-linux-amd64.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-packages
          path: release-assets/*
          retention-days: 14

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-android, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: List Release Files
        run: ls -lh downloaded-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: downloaded-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
