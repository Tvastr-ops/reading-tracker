name: Build & Release Client

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Android Target Architecture'
        required: true
        default: 'android-arm64'
        type: choice
        options:
          - 'android-arm64'
          - 'all'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/client
          flutter pub get

      - name: Decode Android Keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/client/android/app/release.keystore

      - name: Build ARM64 Release APK
        if: ${{ inputs.target_arch == 'android-arm64' || startsWith(github.ref, 'refs/tags/v') || github.event_name != 'workflow_dispatch' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd apps/client
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "main" ] || [ "$VERSION_NAME" = "dev" ]; then
            VERSION_NAME="2.1.0"
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          flutter build apk --target-platform android-arm64 --release --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" --android-skip-build-dependency-validation
          mkdir -p ../../release-assets
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../../release-assets/paperback-v${VERSION_NAME}-arm64.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk "../../release-assets/paperback-v${VERSION_NAME}-arm64.apk"
          fi

      - name: Build Universal & Split Release APKs (Optional)
        if: ${{ inputs.target_arch == 'all' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd apps/client
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "main" ] || [ "$VERSION_NAME" = "dev" ]; then
            VERSION_NAME="2.1.0"
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          flutter build apk --split-per-abi --release --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" --android-skip-build-dependency-validation
          mkdir -p ../../release-assets
          [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../../release-assets/paperback-v${VERSION_NAME}-arm64.apk" || true
          [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] && cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../../release-assets/paperback-v${VERSION_NAME}-armv7.apk" || true
          [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ] && cp build/app/outputs/flutter-apk/app-x86_64-release.apk "../../release-assets/paperback-v${VERSION_NAME}-x86_64.apk" || true
          [ -f build/app/outputs/flutter-apk/app-release.apk ] && cp build/app/outputs/flutter-apk/app-release.apk "../../release-assets/paperback-v${VERSION_NAME}-universal.apk" || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release-assets/*.apk
          retention-days: 14

  build-linux:
    name: Build Linux Desktop (DEB, AppImage & Tarball)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Build Dependencies & Flatpak SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak install -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08 || true

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/client
          flutter pub get

      - name: Build Linux Release Bundle
        run: |
          cd apps/client
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "main" ] || [ "$VERSION_NAME" = "dev" ]; then
            VERSION_NAME="2.2.0a"
          fi
          flutter build linux --release --build-name="$VERSION_NAME"

      - name: Package Linux Artifacts
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-packages
          path: release-assets/*
          retention-days: 14

  build-windows:
    name: Build Windows x64 Bundle
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/client
          flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          cd apps/client
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version -or $version -eq "main" -or $version -eq "dev") { $version = "2.1.0" }
          flutter build windows --release --build-name="$version"
          New-Item -ItemType Directory -Force -Path "../../release-assets"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "../../release-assets/paperback-v$version-windows-x64.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-zip
          path: release-assets/*.zip
          retention-days: 14

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-android, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: List Release Files
        run: ls -lh downloaded-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: downloaded-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
