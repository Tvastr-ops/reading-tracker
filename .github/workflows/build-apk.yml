name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'android-arm64'
        type: choice
        options:
          - 'android-arm64'
          - 'all'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/client
          flutter pub get

      - name: Build ARM64 Release APK
        if: ${{ inputs.target_arch == 'android-arm64' || startsWith(github.ref, 'refs/tags/v') || github.event_name != 'workflow_dispatch' }}
        run: |
          cd apps/client
          flutter build apk --target-platform android-arm64 --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/reading-tracker-arm64.apk 2>/dev/null || true

      - name: Build Universal Release APK (Optional)
        if: ${{ inputs.target_arch == 'all' }}
        run: |
          cd apps/client
          flutter build apk --split-per-abi --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reading-tracker-apk
          path: apps/client/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/client/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
