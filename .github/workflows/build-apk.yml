name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target Architecture'
        required: true
        default: 'android-arm64'
        type: choice
        options:
          - 'android-arm64'
          - 'all'

jobs:
  build-apk:
    name: Build Android APK (${{ inputs.target_arch || 'android-arm64' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/client
          flutter pub get

      - name: Build ARM64 Release APK
        if: ${{ inputs.target_arch == 'android-arm64' || github.event_name != 'workflow_dispatch' }}
        run: |
          cd apps/client
          flutter build apk --target-platform android-arm64 --release

      - name: Build Universal Release APK
        if: ${{ inputs.target_arch == 'all' }}
        run: |
          cd apps/client
          flutter build apk --split-per-abi --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reading-tracker-apk
          path: apps/client/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
