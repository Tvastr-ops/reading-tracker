<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
  <defs>
    <style>
      .bg-rect { fill: #FAF6EF; stroke: #1E1B18; stroke-width: 2.5; rx: 12; }
      .shadow-rect { fill: #1E1B18; rx: 12; }
      .title-text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace; font-size: 34px; font-weight: 900; letter-spacing: 2px; fill: #1E1B18; }
      .cursor { fill: #E11D48; }
      .badge-bg { fill: #1E1B18; rx: 6; }
      .badge-text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 800; fill: #FAF6EF; letter-spacing: 1.5px; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 13.5px; font-weight: 500; fill: #57534E; letter-spacing: 0.5px; }
      .dot { fill: #E11D48; }

      @media (prefers-color-scheme: dark) {
        .bg-rect { fill: #1C1917; stroke: #F5F5F4; }
        .shadow-rect { fill: #E11D48; }
        .title-text { fill: #F5F5F4; }
        .subtitle-text { fill: #A8A29E; }
        .badge-bg { fill: #E11D48; }
        .badge-text { fill: #FFFFFF; }
      }
    </style>
  </defs>

  <!-- Offset Brutalist Shadow -->
  <rect x="16" y="16" width="768" height="152" class="shadow-rect" />

  <!-- Main Card Container -->
  <rect x="12" y="12" width="768" height="152" class="bg-rect" />

  <!-- Floating Book Icon with Native SMIL Animation -->
  <g transform="translate(48, 48)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="48,48; 48,43; 48,48"
      dur="3s"
      repeatCount="indefinite"
    />
    <!-- Book Spine & Pages -->
    <rect x="0" y="0" width="56" height="72" rx="4" fill="#E11D48" stroke="#1E1B18" stroke-width="2" />
    <path d="M 12 12 L 44 12 M 12 24 L 44 24 M 12 36 L 36 36 M 12 48 L 40 48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <!-- Mini Bookmark Ribbon -->
    <path d="M 40 0 L 40 28 L 46 22 L 52 28 L 52 0 Z" fill="#F59E0B" />
  </g>

  <!-- Content Group -->
  <g transform="translate(130, 0)">
    <!-- Evergreen Badge -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="224" height="22" class="badge-bg" />
      <text x="112" y="15" text-anchor="middle" class="badge-text">OPEN-SOURCE • PRIVACY-FIRST</text>
    </g>

    <!-- Animated Monospace Title with Blinking Cursor -->
    <text x="0" y="94" class="title-text">
      PAPERBACK<tspan class="cursor">_<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" /></tspan>
    </text>

    <!-- Subtitle with Bullet Accents -->
    <text x="0" y="128" class="subtitle-text">
      Offline-First SQLite <tspan class="dot">•</tspan> Multi-Tier Progression <tspan class="dot">•</tspan> Privacy-First Sync
    </text>
  </g>
</svg>
